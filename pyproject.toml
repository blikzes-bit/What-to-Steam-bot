[project]
name = "vo-chto-bot"
version = "0.1.0"
description = "Telegram Steam party picker and wishlist discount notifier"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "aiogram>=3.20,<4",
    "alembic>=1.15,<2",
    "apscheduler>=3.11,<4",
    "asyncpg>=0.30,<1",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.8,<3",
    "sqlalchemy[asyncio]>=2.0.40,<2.1",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.26,<2",
    "respx>=0.22,<1",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
include = ["app"]
